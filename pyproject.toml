[project]
name = "nostrhost-policy"
version = "0.1.2"
description = "nostrhost reusable authorisation library: roles, scopes, NIP-98, delegations, approvals/confirmation, owner co-signature, audit"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "nostr-sdk>=0.45.1",
    "pydantic>=2.13.5",
    "nostrhost-protocol>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nostrhost_policy"]
[tool.uv.sources]
nostrhost-protocol = { path = "../nostrhost-protocol/python" }
