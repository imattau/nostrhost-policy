[project]
name = "nostrhost-policy"
version = "0.1.0"
description = "nostrhost reusable authorisation library: roles, scopes, NIP-98, delegations, approvals/confirmation, owner co-signature, audit"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "bech32>=1.2.0",
    "coincurve>=21.0.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nostrhost_policy"]